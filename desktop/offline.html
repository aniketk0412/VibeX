<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Vibex — offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0B0C10; color: #EEF0F5; font-family: system-ui, sans-serif; }
  main { text-align: center; padding: 32px; }
  .mark { width: 64px; height: 64px; border-radius: 16px; background: #5E5CE6; display: inline-grid; place-items: center; margin-bottom: 18px; }
  .mark svg { width: 36px; height: 36px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #B4AC98; font-size: 14px; margin: 0 0 22px; }
  button { font: inherit; font-weight: 600; color: #FFFFFF; background: #5E5CE6; border: 0; border-radius: 10px; padding: 10px 20px; cursor: pointer; }
  button:hover { background: #7473F0; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden>
    <svg viewBox="0 0 100 100" fill="none"><g stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><path d="M30 33 L47 50 L30 67"/><path d="M48 33 L65 50 L48 67"/></g></svg>
  </div>
  <h1>Can't reach Vibex</h1>
  <p>Check your connection — builds run in the cloud, so the app needs the network.</p>
  <button onclick="location.href = new URLSearchParams(location.search).get('back') || 'https://vibe-x-liart.vercel.app'">Retry</button>
</main>
</body>
</html>
